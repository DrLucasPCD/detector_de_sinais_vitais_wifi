[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rf-sense"
version = "0.2.0"
description = "Agregador local de sensoriamento Wi-Fi CSI para ESP32-S3"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "RF Sense" }]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
homekit = [
  "HAP-python[QRCode]>=4.9,<5",
]
integrations = [
  "paho-mqtt>=2.1,<3",
]
dev = [
  "pytest>=8.3,<10",
  "httpx>=0.28,<1",
]

[project.scripts]
rf-sense = "rf_sense.__main__:main"
rf-sense-simulator = "rf_sense.simulator:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rf_sense = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
